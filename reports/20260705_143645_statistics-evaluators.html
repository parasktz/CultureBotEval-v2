<script>
(function(){
  const P = JSON.parse(document.getElementById('report-data').textContent);
  const EVAL = P.evList, SUMMARY = P.summary, LLM_COLOR = P.colors;
  function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}
  function ini(n){return String(n||'?').trim().split(/\s+/).map(w=>w[0]).join('').substring(0,2).toUpperCase();}

  document.getElementById('cards').innerHTML =
    '<div class="card"><div class="card-lbl">Evaluators</div><div class="card-val">'+SUMMARY.evaluators+'</div></div>'+
    '<div class="card"><div class="card-lbl">Σύνολο αξιολογήσεων</div><div class="card-val">'+SUMMARY.totalRatings+'</div></div>'+
    '<div class="card"><div class="card-lbl">Queries</div><div class="card-val">'+SUMMARY.queries+'</div></div>'+
    '<div class="card"><div class="card-lbl">LLMs</div><div class="card-val">'+SUMMARY.llms+'</div></div>';

  window.renderList = function(){
    const sortBy = document.getElementById('sort-sel').value;
    let evs = EVAL.slice();
    if(!evs.length){ document.getElementById('ev-list').innerHTML='<div class="empty">📭 Καμία αξιολόγηση ακόμη.</div>'; return; }
    evs.sort((a,b)=>{
      if(sortBy==='name') return a.name.localeCompare(b.name,'el');
      if(sortBy==='queries') return b.queries.length-a.queries.length || b.total-a.total;
      return b.total-a.total;
    });
    document.getElementById('ev-list').innerHTML = evs.map((e,idx)=>buildCard(e,idx)).join('');
    document.querySelectorAll('.ev-head').forEach(h=>{ h.onclick=()=>h.parentElement.classList.toggle('open'); });
  };

  function buildCard(e,idx){
    const llms = e.llms.slice().sort();
    const llmPills = Object.entries(e.byLlm).sort((a,b)=>b[1]-a[1]).map(([llm,n])=>{
      const c = LLM_COLOR[llm]||'#6b7280';
      return '<span class="llm-pill" style="background:'+c+'">'+esc(llm)+'<span class="n">'+n+'</span></span>';
    }).join('');
    const queryList = Object.entries(e.byQuery).sort((a,b)=>b[1]-a[1]);
    const cols = llms;
    const head = '<tr><th class="q">Query</th>'+cols.map(l=>'<th><span class="llm-dot" style="background:'+(LLM_COLOR[l]||'#6b7280')+'"></span>'+esc(l)+'</th>').join('')+'<th class="tot">Σύνολο</th></tr>';
    const rows = queryList.map(([q])=>{
      const cells = cols.map(l=>{ const n=(e.matrix[q]&&e.matrix[q][l])||0; return '<td><span class="cell-n'+(n===0?' cell-0':'')+'">'+(n||'·')+'</span></td>'; }).join('');
      const rowTot = cols.reduce((a,l)=>a+((e.matrix[q]&&e.matrix[q][l])||0),0);
      return '<tr><td class="q">'+esc(q)+'</td>'+cells+'<td class="tot">'+rowTot+'</td></tr>';
    }).join('');
    const colTotals = cols.map(l=>'<td class="tot">'+(e.byLlm[l]||0)+'</td>').join('');
    const footer = '<tr><td class="q tot">Σύνολο</td>'+colTotals+'<td class="tot">'+e.total+'</td></tr>';
    return '<div class="ev-card'+(idx===0?' open':'')+'">'+
      '<div class="ev-head">'+
        '<svg class="ev-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>'+
        '<div class="ev-avatar">'+ini(e.name)+'</div>'+
        '<div class="ev-id"><div class="ev-name">'+esc(e.name)+'</div>'+(e.email?'<div class="ev-email">'+esc(e.email)+'</div>':'')+'</div>'+
        '<div class="ev-chips">'+
          '<span class="ev-chip"><strong>'+e.total+'</strong> αξιολογήσεις</span>'+
          '<span class="ev-chip"><strong>'+e.queries.length+'</strong> queries</span>'+
          '<span class="ev-chip"><strong>'+e.llms.length+'</strong> LLMs</span>'+
        '</div>'+
      '</div>'+
      '<div class="ev-body"><div class="ev-body-inner">'+
        '<div class="sub-h">Αξιολογήσεις ανά LLM</div><div class="llm-bar">'+llmPills+'</div>'+
        '<div class="sub-h">Πίνακας: Query × LLM (πλήθος αξιολογήσεων)</div>'+
        '<div class="matrix-wrap"><table class="matrix"><thead>'+head+'</thead><tbody>'+rows+footer+'</tbody></table></div>'+
      '</div></div>'+
    '</div>';
  }

  renderList();
})();
</script>
