<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>CultureBotEval-v2 — Evaluator Activity</title>
<script src="config.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<style>
:root{
  --bg:#f4f3ee;--card:#fff;--border:rgba(0,0,0,.09);
  --text:#18180f;--muted:#68685f;--muted-2:#a8a89e;
  --blue:#2b7fd4;--blue-bg:#e8f2fc;--blue-t:#0a3d6e;
  --green-bg:#e0f4ec;--green-t:#074d35;--r:10px;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}
.topbar{background:var(--card);border-bottom:.5px solid var(--border);padding:.8rem 1.5rem;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:20;}
.topbar-logo{font-size:11px;letter-spacing:.12em;color:var(--muted);text-transform:uppercase;}
.topbar-logo a{color:inherit;text-decoration:none;}
.topbar-sep{color:var(--border);}
.topbar-title{font-size:15px;font-weight:500;color:var(--blue-t);}
.back{font-size:12px;color:var(--blue);text-decoration:none;}
.back:hover{text-decoration:underline;}
.topbar-spacer{flex:1;}
.topbar-user{font-size:11px;color:var(--muted);}
.btn{background:var(--blue);color:#fff;border:none;border-radius:6px;padding:.5rem .9rem;font-size:13px;font-weight:500;cursor:pointer;font-family:inherit;}
.btn.ghost{background:transparent;color:var(--muted);text-decoration:underline;}
.screen{min-height:70vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:2rem;text-align:center;}
.login-box{background:var(--card);border:.5px solid var(--border);border-radius:var(--r);padding:2rem;max-width:340px;width:100%;box-shadow:0 4px 24px rgba(0,0,0,.06);}
.login-box h2{font-size:18px;font-weight:500;color:var(--blue-t);margin-bottom:.3rem;}
.login-box input{width:100%;padding:.55rem .75rem;border:.5px solid var(--border);border-radius:6px;font-size:13px;margin-top:.6rem;outline:none;}
.login-box .btn{width:100%;margin-top:.8rem;}
.muted{color:var(--muted);font-size:13px;}
.err{font-size:12px;color:#c0392b;min-height:16px;margin-top:.4rem;}

.wrap{max-width:1000px;margin:0 auto;padding:1.5rem 1.25rem 4rem;}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin-bottom:1.5rem;}
.card{background:var(--card);border:.5px solid var(--border);border-radius:var(--r);padding:1rem 1.2rem;}
.card-lbl{font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);}
.card-val{font-size:26px;font-weight:600;color:var(--blue-t);margin-top:.25rem;}

.sort-row{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);margin-bottom:1rem;}
.sort-row select{padding:.35rem .6rem;border:.5px solid var(--border);border-radius:6px;font-size:12px;background:var(--card);font-family:inherit;}

.ev-card{background:var(--card);border:.5px solid var(--border);border-radius:var(--r);margin-bottom:.75rem;overflow:hidden;}
.ev-head{display:flex;align-items:center;gap:.85rem;padding:.9rem 1.1rem;cursor:pointer;user-select:none;transition:background .12s;}
.ev-head:hover{background:rgba(0,0,0,.015);}
.ev-chevron{width:15px;height:15px;color:var(--muted-2);transition:transform .25s;flex-shrink:0;}
.ev-card.open .ev-chevron{transform:rotate(90deg);}
.ev-avatar{width:34px;height:34px;border-radius:50%;background:var(--green-bg);color:var(--green-t);font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.ev-id{flex:1;min-width:0;}
.ev-name{font-size:14px;font-weight:500;color:var(--text);}
.ev-email{font-size:11.5px;color:var(--muted);font-family:monospace;}
.ev-chips{display:flex;gap:.4rem;flex-shrink:0;flex-wrap:wrap;justify-content:flex-end;}
.ev-chip{font-size:11px;background:var(--bg);border:.5px solid var(--border);border-radius:999px;padding:2px 10px;color:var(--text);}
.ev-chip strong{color:var(--blue-t);}

.ev-body{max-height:0;overflow:hidden;transition:max-height .4s ease;}
.ev-card.open .ev-body{max-height:6000px;}
.ev-body-inner{padding:.4rem 1.1rem 1.25rem;}

.sub-h{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:1rem 0 .55rem;}
.llm-bar{display:flex;flex-wrap:wrap;gap:.4rem;}
.llm-pill{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:#fff;border-radius:999px;padding:3px 11px;font-weight:500;text-shadow:0 1px 1px rgba(0,0,0,.12);}
.llm-pill .n{background:rgba(255,255,255,.28);border-radius:999px;padding:0 6px;font-size:10.5px;font-weight:600;}

.matrix-wrap{overflow-x:auto;margin-top:.3rem;}
table.matrix{border-collapse:collapse;font-size:12px;width:100%;min-width:420px;}
table.matrix th,table.matrix td{border:.5px solid var(--border);padding:6px 9px;text-align:center;}
table.matrix th.q,table.matrix td.q{text-align:left;max-width:340px;}
table.matrix thead th{background:var(--bg);font-weight:600;font-size:11px;white-space:nowrap;}
table.matrix td.q{color:var(--text);font-size:12px;}
table.matrix tbody tr:nth-child(even){background:rgba(0,0,0,.012);}
.cell-n{display:inline-block;min-width:20px;font-variant-numeric:tabular-nums;font-weight:600;}
.cell-0{color:var(--muted-2);font-weight:400;}
.llm-pill-unrated{background:repeating-linear-gradient(45deg,#fbeaea,#fbeaea 6px,#f7dede 6px,#f7dede 12px)!important;
                  color:#b14d4d!important;font-style:italic;border:.5px solid #e8b4b4;}
.llm-pill-unrated .n{background:rgba(177,77,77,.18)!important;color:#b14d4d!important;}
.col-unrated{color:#b14d4d!important;font-style:italic;}
.tot{background:var(--blue-bg)!important;color:var(--blue-t);font-weight:600;}
.llm-dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:5px;vertical-align:middle;}
/* Persona grouping + unevaluated highlighting */
.matrix tr.prow td.persona{background:var(--blue-bg);text-align:left;font-size:12px;
  border-top:1.5px solid var(--blue-t);padding:7px 10px;}
.persona-name{font-weight:700;color:var(--blue-t);}
.pcell-miss{display:inline-block;margin-left:8px;background:#fbeaea;color:#b14d4d;border:.5px solid #e8b4b4;
  border-radius:999px;padding:1px 9px;font-size:11px;font-weight:600;}
.pcell-ok{display:inline-block;margin-left:8px;background:#e7f6ec;color:#2e7d46;border:.5px solid #b6dfc4;
  border-radius:999px;padding:1px 9px;font-size:11px;font-weight:600;}
.pcell-frac{margin-left:6px;color:var(--muted);font-size:11px;}
.cell-miss{color:#b14d4d;font-weight:700;background:#fbeaea;border-radius:4px;padding:0 7px;}
.cell-na{color:var(--muted-2);font-weight:400;}
.pmiss-bar{display:flex;flex-wrap:wrap;gap:6px;margin:.2rem 0 .4rem;}
.pmiss{font-size:11.5px;border-radius:6px;padding:3px 10px;border:.5px solid var(--border);}
.pmiss-some{background:#fbeaea;color:#b14d4d;border-color:#e8b4b4;}
.pmiss-zero{background:#f3f0f0;color:#9a6b6b;border-color:#ddd0d0;border-style:dashed;}
.pmiss-none{background:#e7f6ec;color:#2e7d46;border-color:#b6dfc4;}
.pmiss-frac{opacity:.75;font-size:10.5px;margin-left:2px;}
.ev-chip-warn{background:#fbeaea!important;color:#b14d4d!important;border-color:#e8b4b4!important;}
.empty{padding:3rem 1rem;text-align:center;color:var(--muted);font-size:14px;}
</style>
</head>
<body>

<div class="topbar">
  <a class="back" href="statistics.html">← Back</a>
  <span class="topbar-sep">|</span>
  <span class="topbar-logo"><a href="role.html">CultureBotEval-v2</a></span>
  <span class="topbar-sep">|</span>
  <span class="topbar-title">Evaluator Activity</span>
  <span class="topbar-spacer"></span>
  <span class="topbar-user" id="user-email"></span>
  <button class="btn ghost" id="logout-btn" style="display:none" onclick="doLogout()">Sign out</button>
</div>

<div class="screen" id="screen-loading"><div class="muted">Loading…</div></div>

<div class="screen" id="screen-login" style="display:none">
  <div class="login-box">
    <h2>Sign in</h2>
    <p class="muted">Access restricted to verified users.</p>
    <input id="email" type="email" placeholder="Email" autocomplete="username"/>
    <input id="pass"  type="password" placeholder="Password" autocomplete="current-password"/>
    <div class="err" id="login-err"></div>
    <button class="btn" onclick="doLogin()">Sign in</button>
  </div>
</div>

<div class="screen" id="screen-denied" style="display:none">
  <div class="muted">Access denied — your account is not a verified user.</div>
  <button class="btn ghost" onclick="doLogout()">Sign out</button>
</div>

<div class="wrap" id="screen-app" style="display:none">
  <div class="cards" id="cards"></div>
  <div class="sort-row" id="sort-row">
    <span>Ταξινόμηση:</span>
    <select id="sort-sel" onchange="renderList()">
      <option value="total">Πλήθος αξιολογήσεων (φθίνουσα)</option>
      <option value="queries">Πλήθος queries</option>
      <option value="name">Όνομα (Α→Ω)</option>
    </select>
  </div>
  <div id="ev-list"></div>
</div>

<script>
/* ── criteria & rating normalisation (same as statistics.html) ── */
function normIndexed(x){
  const out=new Array(13).fill(null);
  if(Array.isArray(x)){ for(let i=1;i<=12&&i<x.length;i++) out[i]=(x[i]===''?null:(x[i]??null)); }
  else if(x&&typeof x==='object'){ Object.entries(x).forEach(([k,v])=>{const i=parseInt(k,10);if(i>=1&&i<=12)out[i]=(v===''?null:v);}); }
  return out;
}
function llmHasRatings(b){ if(!b||typeof b!=='object')return false; const r=normIndexed(b.ratings); for(let i=1;i<=12;i++){if(r[i])return true;} return false; }
function validLlmBlocks(rec){
  if(!rec||typeof rec.llms!=='object'||rec.llms===null) return [];
  return Object.values(rec.llms).filter(llmHasRatings)
    .map(l=>({title:(l.llmTitle||'Untitled LLM').toString().trim()||'Untitled LLM'}));
}
/* All LLM titles DEFINED in a session (regardless of whether anyone rated them),
   so unrated models (e.g. CultureBot v2) still appear as columns. */
function sessionLlmTitles(s){
  if(!s) return [];
  let arr=s.llms;
  if(arr&&!Array.isArray(arr)&&typeof arr==='object') arr=Object.values(arr);
  if(!Array.isArray(arr)) return [];
  const out=[];
  arr.forEach(l=>{ if(!l||typeof l!=='object')return;
    const t=(l.title||l.llmTitle||'Untitled LLM').toString().trim()||'Untitled LLM';
    if(!out.includes(t)) out.push(t); });
  return out;
}
/* Canonical column order requested for the report. Any LLM not in this list is
   appended afterwards (alphabetically) so nothing is ever dropped. */
const LLM_ORDER=['ChatGPT','Gemini','CultureBot v1','CultureBot v2'];
function orderLlms(list){
  const set=new Set(list);
  const ordered=LLM_ORDER.filter(l=>set.has(l));
  const rest=[...set].filter(l=>!LLM_ORDER.includes(l)).sort();
  return [...ordered,...rest];
}
function forEachEvaluation(sessions, cb){
  Object.entries(sessions).forEach(([code,s])=>{
    if(!s||typeof s!=='object')return;
    const ev=s.evaluations; if(!ev||typeof ev!=='object')return;
    Object.entries(ev).forEach(([key,rec])=>{
      if(!rec||typeof rec!=='object')return;
      if(key==='timestamp'||key==='metadata')return;
      cb(s,rec,key,code);
    });
  });
}
function esc(s){const d=document.createElement('div');d.textContent=(s==null?'':String(s));return d.innerHTML;}
function ini(n){return String(n||'?').trim().split(/\s+/).map(w=>w[0]).join('').substring(0,2).toUpperCase();}

/* ── dynamic per-LLM colours ── */
const LLM_BRAND={'ChatGPT':'#10a37f','Gemini':'#4285f4','SearchCultureBot v1':'#b14dd1','SearchCultureBot v2':'#7e57c2','SearchCultureBot v3':'#dc4b64'};
const PALETTE=['#10a37f','#4285f4','#b14dd1','#e8833a','#dc4b64','#2bb3a3','#7e57c2','#c0a800','#5c8a3a','#3a7bd5','#d6478e','#8d6e63','#00897b','#ef6c00','#5e35b1','#43a047'];
let LLM_COLOR={};
function buildLlmColors(labels){
  const map={},used=new Set();
  labels.forEach(l=>{if(LLM_BRAND[l]){map[l]=LLM_BRAND[l];used.add(map[l]);}});
  let pi=0;
  labels.slice().sort().forEach(l=>{ if(map[l])return;
    while(used.has(PALETTE[pi%PALETTE.length])&&used.size<PALETTE.length)pi++;
    map[l]=PALETTE[pi%PALETTE.length];used.add(map[l]);pi++; });
  return map;
}

let EVAL={}; // key -> {name,email,total,byQuery,byLlm,matrix,queries:Set,llms:Set}
let GLOBAL={llms:new Set()};

firebase.initializeApp(FIREBASE_CONFIG);
const auth=firebase.auth();
const db=firebase.database();

/* Uses the existing system login — no separate sign-in on this page.
   Any user already authenticated in the system sees the FULL report
   (all evaluators). No admin/verified gate, no per-user scoping. */
auth.onAuthStateChanged(async user=>{
  if(!user){ show('screen-login'); return; }   // only reached if not logged in anywhere
  const ue=document.getElementById('user-email'); if(ue) ue.textContent=user.email||'';
  const lo=document.getElementById('logout-btn'); if(lo) lo.style.display='inline-block';
  await loadData();
});

async function loadData(){
  show('screen-loading');
  try{
    const snap=await db.ref('sessions').once('value');
    aggregate(snap.val()||{});
    renderCards();
    renderList();
    show('screen-app');
  }catch(e){
    document.getElementById('screen-loading').innerHTML='<div class="muted">Failed to load: '+esc(e.message)+'</div>';
  }
}

function aggregate(sessions){
  EVAL={}; GLOBAL={llms:new Set(), allLlms:new Set()};
  // Roster maps built from session definitions (independent of who rated what):
  //   queryRoster[q]   = Set of LLM titles defined for that query
  //   queryPersona[q]  = persona title that owns the query
  //   personaQueries[p]= Set of queries belonging to the persona
  //   personaExpected[p] = total expected evaluations (Σ over queries of #LLMs)
  const queryRoster={}, queryPersona={}, personaQueries={}, personaExpected={};
  Object.values(sessions).forEach(s=>{
    if(!s||typeof s!=='object')return;
    const titles=sessionLlmTitles(s);
    if(!titles.length)return;
    const q=(s.query||'(no query)');
    const p=(s.personaTitle||'Unknown persona');
    queryRoster[q]=queryRoster[q]||new Set();
    titles.forEach(t=>{ queryRoster[q].add(t); GLOBAL.allLlms.add(t); });
    queryPersona[q]=p;
    (personaQueries[p]=personaQueries[p]||new Set()).add(q);
  });
  Object.entries(personaQueries).forEach(([p,qs])=>{
    let exp=0; qs.forEach(q=>exp+=(queryRoster[q]?queryRoster[q].size:0));
    personaExpected[p]=exp;
  });
  GLOBAL.queryPersona=queryPersona;
  GLOBAL.personaQueries=personaQueries;
  GLOBAL.personaExpected=personaExpected;
  GLOBAL.queryRoster=queryRoster;

  forEachEvaluation(sessions,(s,rec)=>{
    const blocks=validLlmBlocks(rec);
    if(!blocks.length) return;
    const key=rec.evaluatorUid||rec.evaluatorEmail||rec.evaluator||'anon';
    const E=EVAL[key]||(EVAL[key]={
      name:rec.evaluator||rec.evaluatorEmail||'Unknown',
      email:rec.evaluatorEmail||'',
      total:0,byQuery:{},byLlm:{},matrix:{},queries:new Set(),llms:new Set(),allLlms:new Set(),
      personas:new Set()
    });
    const q=(s.query||'(no query)');
    const p=(s.personaTitle||queryPersona[q]||'Unknown persona');
    E.personas.add(p);
    // Seed this evaluator's column roster with every LLM defined for the query.
    (queryRoster[q]||new Set()).forEach(t=>E.allLlms.add(t));
    blocks.forEach(b=>{
      const llm=b.title;
      E.total++;
      E.byQuery[q]=(E.byQuery[q]||0)+1;
      E.byLlm[llm]=(E.byLlm[llm]||0)+1;
      (E.matrix[q]=E.matrix[q]||{})[llm]=(E.matrix[q][llm]||0)+1;
      E.queries.add(q); E.llms.add(llm); E.allLlms.add(llm);
      GLOBAL.llms.add(llm); GLOBAL.allLlms.add(llm);
    });
  });
  LLM_COLOR=buildLlmColors([...GLOBAL.allLlms]);
}

function renderCards(){
  const evs=Object.values(EVAL);
  const totalRatings=evs.reduce((a,e)=>a+e.total,0);
  const allQ=new Set(); evs.forEach(e=>e.queries.forEach(q=>allQ.add(q)));
  document.getElementById('cards').innerHTML=`
    <div class="card"><div class="card-lbl">Evaluators</div><div class="card-val">${evs.length}</div></div>
    <div class="card"><div class="card-lbl">Σύνολο αξιολογήσεων</div><div class="card-val">${totalRatings}</div></div>
    <div class="card"><div class="card-lbl">Queries</div><div class="card-val">${allQ.size}</div></div>
    <div class="card"><div class="card-lbl">LLMs</div><div class="card-val">${GLOBAL.allLlms.size}</div></div>`;
}

function renderList(){
  const sortBy=document.getElementById('sort-sel').value;
  let evs=Object.entries(EVAL).map(([k,e])=>({k,...e}));
  if(!evs.length){
    document.getElementById('ev-list').innerHTML='<div class="empty">📭 Καμία αξιολόγηση ακόμη.</div>';
    return;
  }
  evs.sort((a,b)=>{
    if(sortBy==='name') return a.name.localeCompare(b.name,'el');
    if(sortBy==='queries') return b.queries.size-a.queries.size || b.total-a.total;
    return b.total-a.total;
  });
  document.getElementById('ev-list').innerHTML=evs.map((e,idx)=>buildCard(e,idx)).join('');
  // wire toggles
  document.querySelectorAll('.ev-head').forEach(h=>{
    h.onclick=()=>h.parentElement.classList.toggle('open');
  });
}

function buildCard(e,idx){
  // Columns = full canonical roster (ChatGPT, Gemini, CultureBot v1, CultureBot v2, …),
  // including models this evaluator hasn't rated yet.
  const cols=orderLlms([...e.allLlms]);
  // LLM summary pills — show every roster LLM; unrated ones get a striped style + 0.
  const llmPills=cols.map(llm=>{
    const n=e.byLlm[llm]||0;
    if(n>0){
      const c=LLM_COLOR[llm]||'#6b7280';
      return `<span class="llm-pill" style="background:${c}">${esc(llm)}<span class="n">${n}</span></span>`;
    }
    return `<span class="llm-pill llm-pill-unrated" title="No ratings yet">${esc(llm)}<span class="n">0</span></span>`;
  }).join('');

  // Build the set of queries to display, grouped by persona.
  // For every persona this evaluator engaged with, show ALL of that persona's
  // queries (from the session roster) so missing ones are visible.
  const personaQueries=GLOBAL.personaQueries||{};
  const queryPersona=GLOBAL.queryPersona||{};
  const queryRoster=GLOBAL.queryRoster||{};

  // Personas the evaluator has touched (used for the detailed matrix below).
  const personas=[...(e.personas||new Set())].sort((a,b)=>a.localeCompare(b,'el'));

  // Per-persona missing-evaluation summary over ALL personas in the project,
  // so personas the evaluator hasn't started yet also appear (fully missing).
  const allPersonas=Object.keys(personaQueries).sort((a,b)=>a.localeCompare(b,'el'));
  const personaSummary=allPersonas.map(p=>{
    const qs=[...(personaQueries[p]||new Set())];
    let expected=0, done=0;
    qs.forEach(q=>{
      const roster=queryRoster[q]||new Set();
      roster.forEach(l=>{
        expected++;
        if(e.matrix[q] && e.matrix[q][l]) done++;
      });
    });
    const missing=expected-done;
    const started=done>0;
    const cls=missing===0 ? 'pmiss-none' : (started ? 'pmiss-some' : 'pmiss-zero');
    const tag=missing===0 ? '' : (started ? '' : ' · not started');
    return `<span class="pmiss ${cls}" title="${done} of ${expected} evaluated">
              ${esc(p)}: <strong>${missing}</strong> not evaluated
              <span class="pmiss-frac">(${done}/${expected}${tag})</span>
            </span>`;
  }).join('');

  // Matrix rows grouped by persona. Each persona shows all its queries.
  let rows='';
  personas.forEach(p=>{
    const qs=[...(personaQueries[p]||new Set())].sort((a,b)=>a.localeCompare(b,'el'));
    let pMissing=0, pExpected=0;
    const qRows=qs.map(q=>{
      const roster=queryRoster[q]||new Set();
      const cells=cols.map(l=>{
        const inRoster=roster.has(l);
        const n=(e.matrix[q]&&e.matrix[q][l])||0;
        if(inRoster){ pExpected++; if(!n) pMissing++; }
        if(!inRoster) return `<td><span class="cell-na" title="LLM not part of this query">–</span></td>`;
        if(n>0)       return `<td><span class="cell-n">${n}</span></td>`;
        return `<td><span class="cell-n cell-miss" title="Not evaluated yet">0</span></td>`;
      }).join('');
      const rowTot=cols.reduce((a,l)=>a+((e.matrix[q]&&e.matrix[q][l])||0),0);
      return `<tr><td class="q">${esc(q)}</td>${cells}<td class="tot">${rowTot}</td></tr>`;
    }).join('');
    const span=qs.length||1;
    // Persona group header row spanning the query column
    const missBadge=pMissing>0
      ? `<span class="pcell-miss">${pMissing} not evaluated</span>`
      : `<span class="pcell-ok">✓ complete</span>`;
    rows+=`<tr class="prow"><td class="persona" colspan="${cols.length+2}">
             <span class="persona-name">${esc(p)}</span> ${missBadge}
             <span class="pcell-frac">(${pExpected-pMissing}/${pExpected} evaluated)</span>
           </td></tr>` + qRows;
  });

  // Matrix header: Persona context is shown via group rows, first col = Query.
  const head=`<tr><th class="q">Query</th>${cols.map(l=>{
    const rated=(e.byLlm[l]||0)>0;
    return `<th${rated?'':' class="col-unrated" title="No ratings yet"'}><span class="llm-dot" style="background:${rated?(LLM_COLOR[l]||'#6b7280'):'#d99'}"></span>${esc(l)}</th>`;
  }).join('')}<th class="tot">Σύνολο</th></tr>`;
  const colTotals=cols.map(l=>{
    const n=e.byLlm[l]||0;
    return `<td class="tot${n===0?' col-unrated':''}">${n}</td>`;
  }).join('');
  const footer=`<tr><td class="q tot">Σύνολο</td>${colTotals}<td class="tot">${e.total}</td></tr>`;

  // Overall missing across all personas this evaluator touched.
  let totExpected=0, totMissing=0;
  personas.forEach(p=>{
    [...(personaQueries[p]||new Set())].forEach(q=>{
      (queryRoster[q]||new Set()).forEach(l=>{ totExpected++; if(!(e.matrix[q]&&e.matrix[q][l])) totMissing++; });
    });
  });

  return `
    <div class="ev-card${idx===0?' open':''}">
      <div class="ev-head">
        <svg class="ev-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
        <div class="ev-avatar">${ini(e.name)}</div>
        <div class="ev-id">
          <div class="ev-name">${esc(e.name)}</div>
          ${e.email?`<div class="ev-email">${esc(e.email)}</div>`:''}
        </div>
        <div class="ev-chips">
          <span class="ev-chip"><strong>${e.total}</strong> αξιολογήσεις</span>
          <span class="ev-chip"><strong>${e.queries.size}</strong> queries</span>
          <span class="ev-chip"><strong>${e.llms.size}/${e.allLlms.size}</strong> LLMs</span>
          <span class="ev-chip${totMissing>0?' ev-chip-warn':''}"><strong>${totMissing}</strong> not evaluated</span>
        </div>
      </div>
      <div class="ev-body"><div class="ev-body-inner">
        <div class="sub-h">Αξιολογήσεις ανά LLM</div>
        <div class="llm-bar">${llmPills}</div>
        <div class="sub-h">Μη αξιολογημένα ανά persona</div>
        <div class="pmiss-bar">${personaSummary||'<span class="muted">—</span>'}</div>
        <div class="sub-h">Πίνακας: Persona / Query × LLM (πλήθος αξιολογήσεων)</div>
        <div class="matrix-wrap">
          <table class="matrix">
            <thead>${head}</thead>
            <tbody>${rows}${footer}</tbody>
          </table>
        </div>
      </div></div>
    </div>`;
}

async function doLogin(){
  document.getElementById('login-err').textContent='';
  try{ await auth.signInWithEmailAndPassword(document.getElementById('email').value,document.getElementById('pass').value); }
  catch(e){ document.getElementById('login-err').textContent=e.message; }
}
async function doLogout(){ await auth.signOut(); location.reload(); }
function show(id){
  ['screen-loading','screen-login','screen-denied','screen-app'].forEach(s=>{
    document.getElementById(s).style.display=(s===id)?(s==='screen-app'?'block':'flex'):'none';
  });
}
</script>
