<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Persona Evaluation — Sessions Persona</title>
<link rel="stylesheet" href="styles.css"/>
<style>
.sess-card{background:var(--card);border:.5px solid var(--border);border-radius:var(--r);margin-bottom:1.25rem;overflow:hidden;}
.sess-card-head{padding:1rem 1.25rem;display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap;border-bottom:.5px solid var(--border);}
.sess-num{width:24px;height:24px;border-radius:50%;background:var(--blue-bg);color:var(--blue-t);font-size:11px;font-weight:600;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:2px;}
.sess-code{font-family:monospace;font-weight:600;color:var(--blue-t);background:var(--blue-bg);border-radius:4px;padding:1px 7px;font-size:12px;}
.sess-meta{font-size:12px;color:var(--muted);margin-top:3px;line-height:1.6;}

.sub-cards{padding:1rem 1.25rem;display:flex;flex-direction:column;gap:.65rem;}
.sub-card{border-radius:var(--rsm);padding:9px 13px;}
.sub-label{font-size:10px;font-weight:500;text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px;}
.sub-val{font-size:13px;line-height:1.6;white-space:pre-wrap;}
.sub-role  {background:var(--blue-bg);}
.sub-role   .sub-label{color:var(--blue-t);}
.sub-role   .sub-val{color:var(--blue-t);font-weight:500;}
.sub-query {background:var(--bg);border:.5px solid var(--border);}
.sub-query  .sub-label{color:var(--muted);}
.sub-query  .sub-val{color:var(--text);}
.sub-guide {background:var(--amber-bg);}
.sub-guide  .sub-label{color:var(--amber-t);}
.sub-guide  .sub-val{color:var(--text);}

/* LLM columns table inside session */
.llm-table-wrap{margin-top:8px;overflow-x:auto;border:.5px solid var(--border);border-radius:var(--rsm);}
.llm-table{border-collapse:collapse;width:100%;min-width:100%;table-layout:fixed;}
.llm-table th,.llm-table td{border:.5px solid var(--border);vertical-align:top;padding:8px 10px;text-align:left;}
.llm-th{background:var(--blue-bg);}
.llm-th-num{display:inline-flex;width:18px;height:18px;border-radius:50%;background:var(--blue);color:#fff;font-size:10px;font-weight:600;align-items:center;justify-content:center;margin-bottom:4px;}
.llm-th-title{font-size:13px;font-weight:600;color:var(--blue-t);line-height:1.4;word-break:break-word;}
.llm-td{font-size:12px;color:var(--text);}
.llm-td-desc{color:var(--muted);line-height:1.55;}
.llm-desc-short,.llm-desc-full{white-space:pre-wrap;word-break:break-word;}
.desc-more{border:none;background:none;color:var(--blue-t);font-size:11px;font-weight:600;cursor:pointer;padding:0 2px;font-family:inherit;}
.desc-more:hover{text-decoration:underline;}
.llm-row-count td{background:var(--bg);}
.llm-count-badge{display:inline-block;min-width:20px;text-align:center;background:var(--green-bg);color:var(--green-t);border-radius:999px;padding:1px 8px;font-size:12px;font-weight:700;}
.llm-count-lbl{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-left:5px;}
.llm-td-evs{}
.llm-ev-wrap{display:flex;flex-wrap:wrap;gap:4px;}
.llm-ev-chip{font-size:11px;background:var(--green-bg);color:var(--green-t);border-radius:4px;padding:2px 8px;border:.5px solid rgba(0,0,0,.05);word-break:break-word;}
.llm-ev-none{font-size:11px;color:var(--muted);}
.llm-mini-num{display:inline-flex;width:18px;height:18px;border-radius:50%;background:var(--blue-bg);color:var(--blue-t);font-size:10px;font-weight:600;align-items:center;justify-content:center;flex-shrink:0;}

.evals-bar{background:var(--bg);border-top:.5px solid var(--border);padding:.55rem 1.25rem;font-size:11px;font-weight:500;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;}
.eval-row-item{border-top:.5px solid var(--border);padding:.75rem 1.25rem;display:flex;align-items:flex-start;gap:10px;flex-wrap:wrap;}
.eval-more-btn{flex-shrink:0;align-self:center;}
.eval-details{padding:0 1.25rem .85rem;border-top:.5px solid var(--border);}
.eval-details .llm-scores-group:first-child{margin-top:.75rem;}
.eval-avatar{width:28px;height:28px;border-radius:50%;background:var(--green-bg);color:var(--green-t);font-size:11px;font-weight:600;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px;}
.eval-who{font-size:13px;font-weight:500;}
.eval-when{font-size:11px;color:var(--muted);margin-top:1px;}
.eval-mine{display:inline-block;font-size:10px;color:var(--blue-t);background:var(--blue-bg);border-radius:3px;padding:1px 6px;margin-left:4px;}
.eval-edited{display:inline-block;font-size:10px;color:var(--amber-t);background:var(--amber-bg);border-radius:3px;padding:1px 6px;margin-left:4px;}

.llm-scores-group{margin-top:7px;}
.llm-scores-label{font-size:11px;font-weight:600;color:var(--blue-t);margin-bottom:3px;display:flex;align-items:center;gap:5px;}
.scores-wrap{display:flex;flex-wrap:wrap;gap:3px;margin-bottom:5px;}
.sc{font-size:10px;background:var(--bg);border:.5px solid var(--border);border-radius:4px;padding:2px 6px;color:var(--text);}
.sc.mine{background:var(--blue-bg);color:var(--blue-t);border-color:transparent;}

.edit-form{display:none;border-top:.5px solid var(--border);padding:1.25rem;background:var(--bg);}
.edit-form.open{display:block;}
.edit-llm-sec{margin-bottom:1.25rem;}
.edit-llm-row{display:flex;gap:.6rem;align-items:flex-start;flex-wrap:nowrap;}
.edit-llm-col{flex:1 1 0;min-width:0;background:var(--card);border:.5px solid var(--border);
  border-radius:var(--rsm);padding:.7rem .65rem;}
.edit-llm-sec-title{font-size:13px;font-weight:600;color:var(--blue-t);margin-bottom:.6rem;display:flex;align-items:center;gap:6px;flex-wrap:wrap;word-break:break-word;}
.edit-llm-sec-num{width:20px;height:20px;border-radius:50%;background:var(--blue);color:#fff;font-size:10px;font-weight:600;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.ecc{background:var(--card);border:.5px solid var(--border);border-radius:var(--rsm);padding:.55rem .6rem;margin-bottom:.5rem;}
.ech{display:flex;align-items:flex-start;gap:5px;margin-bottom:6px;}
.ecn{width:18px;height:18px;border-radius:50%;background:var(--blue-bg);color:var(--blue-t);font-size:10px;font-weight:600;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.ecname{font-size:11.5px;font-weight:500;line-height:1.3;}
.emcg{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:6px;}
.emco{padding:3px 9px;border-radius:14px;border:.5px solid var(--border2);font-size:11px;line-height:1.3;cursor:pointer;background:transparent;color:var(--text);font-family:inherit;transition:all .15s;}
.emco:hover{background:var(--card);}

/* On narrow screens, allow the 4 columns to wrap to 2x2 instead of overflowing */
@media(max-width:900px){
  .edit-llm-row{flex-wrap:wrap;}
  .edit-llm-col{flex:1 1 calc(50% - .6rem);min-width:240px;}
}
@media(max-width:560px){
  .edit-llm-col{flex:1 1 100%;}
}
.emco.sel{border-color:var(--blue);background:var(--blue-bg);color:var(--blue-t);font-weight:500;}
.emco.er{border-color:var(--red);}

/* --- Wider layout + larger, clearer text --- */
.page{max-width:1200px;}
.llm-th-title{font-size:16px;}
.llm-td{font-size:14px;}
.llm-td-desc{font-size:14px;line-height:1.6;}
.llm-table th,.llm-table td{padding:11px 14px;}
.llm-count-badge{font-size:14px;padding:2px 11px;}
.llm-count-lbl{font-size:11px;}
.llm-ev-chip{font-size:13px;padding:3px 10px;}
.sc{font-size:13px;}
.eval-who{font-size:15px;}
.llm-scores-label{font-size:14px;}
.desc-more{font-size:13px;}
/* LLM tag next to evaluator email */
.eval-llm-tag{display:inline-block;font-size:12px;font-weight:600;color:var(--blue-t);
  background:var(--blue-bg);border-radius:999px;padding:2px 10px;margin-left:6px;vertical-align:middle;}
.eval-llm-tag.missing{color:var(--muted);background:transparent;border:1px dashed var(--border2);font-weight:500;}
.eval-missing-note{font-size:12px;color:var(--amber-t,#9a6a00);background:var(--amber-bg,#fdf3e0);
  border-radius:var(--rsm);padding:6px 10px;margin-top:.6rem;}
.edit-llm-col-new{border-color:var(--amber-t,#caa24a);background:#fffdf6;}
.edit-new-badge{display:inline-block;font-size:10px;font-weight:600;color:#fff;background:var(--amber-t,#caa24a);
  border-radius:999px;padding:1px 8px;margin-left:6px;vertical-align:middle;}
</style>
</head>
<body>

<div class="hdr">
  <div style="display:flex;align-items:center;gap:10px;">
    <a href="evaluator.html" style="font-size:13px;color:var(--muted);">← Personas</a>
    <div>
      <div class="hdr-title" id="hdr-title">Sessions Persona</div>
      <div class="hdr-sub" id="hdr-sub">Φόρτωση...</div>
    </div>
  </div>
  <div class="hdr-right">
    <div class="avatar" id="av"></div>
    <span class="hdr-email" id="umail"></span>
    <button class="btn sm" id="btn-out">Έξοδος</button>
  </div>
</div>

<div class="page">
  <div id="loading" style="text-align:center;padding:3rem;color:var(--muted);">
    <span class="spin"></span><br><br>Φόρτωση sessions...
  </div>
  <div id="content" style="display:none;"></div>
</div>

<script src="config.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script>
firebase.initializeApp(FIREBASE_CONFIG);
const auth = firebase.auth();
const db   = firebase.database();
const $    = id => document.getElementById(id);
const esc  = s => { const d=document.createElement('div'); d.textContent=String(s||''); return d.innerHTML; };
const now  = () => new Date().toLocaleString('el-GR',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});
const ini  = n => n.trim().split(' ').map(w=>w[0]).join('').substring(0,2).toUpperCase();

const CRITERIA=[
  {id:1,  name:'Hallucination Flag',                      opts:['No Hallucination','Minor Hallucination','Major Hallucination','Cannot Determine']},
  {id:2,  name:'Query Relevance',                         opts:['Fully Relevant','Mostly Relevant','Partially Relevant','Not Relevant']},
  {id:3,  name:'Justification Quality',                   opts:['Excellent','Good','Fair','Poor']},
  {id:4,  name:'Evidence Grounding',                      opts:['Well Grounded','Mostly Grounded','Partially Grounded','Ungrounded']},
  {id:5,  name:'Clarity',                                 opts:['Very Clear','Clear','Somewhat Clear','Unclear']},
  {id:6,  name:'Result Usefulness',                       opts:['Very Useful','Useful','Somewhat Useful','Not Useful']},
  {id:7,  name:'Bias',                                    opts:['No Bias','Slight Bias','Moderate Bias','Significant Bias']},
  {id:8,  name:'Diversity',                               opts:['High','Moderate','Low','None']},
  {id:9,  name:'Completeness / Variety / Representative', opts:['Excellent','Good','Fair','Poor']},
  {id:10, name:'Needed Logical Steps',                    opts:['All Present','Mostly Present','Partially Present','Missing']}
];

let ME = null;
let editState = {};          /* stateKey -> { llms: { idx: {ratings,comments} } } */
let sessionLlmCache = {};    /* sessionCode -> normalized llm array */
const personaTitle = new URLSearchParams(location.search).get('persona') || '';

function normalizeLlms(s){
  if(Array.isArray(s.llms)) return s.llms.filter(Boolean).map(x=>({title:x.title||'',description:x.description||''}));
  if(s.llms && typeof s.llms==='object') return Object.values(s.llms).filter(Boolean).map(x=>({title:x.title||'',description:x.description||''}));
  if(s.llmTitle) return [{title:s.llmTitle, description:s.llmDescription||''}];
  return [];
}

/* Per-LLM eval data for one evaluation, aligned to session LLM indices */
function evalLlmData(ev, llms){
  const out = [];
  for(let i=0;i<llms.length;i++){
    if(ev.llms && ev.llms[i]) out.push({ratings:ev.llms[i].ratings||{}, comments:ev.llms[i].comments||{}});
    else if(i===0 && ev.ratings) out.push({ratings:ev.ratings||{}, comments:ev.comments||{}});  // old single-LLM
    else out.push({ratings:{}, comments:{}});
  }
  return out;
}

auth.onAuthStateChanged(async u => {
  if(!u){ location.href='index.html'; return; }
  ME = u;
  const name = u.displayName || u.email;
  $('umail').textContent = u.email;
  $('av').textContent    = name.trim().split(' ').map(w=>w[0]).join('').substring(0,2).toUpperCase();
  $('hdr-title').textContent = personaTitle || 'Sessions';
  load();
});

$('btn-out').addEventListener('click', async()=>{ await auth.signOut(); location.href='index.html'; });

async function load(){
  try{
    const snap = await db.ref('sessions').get();
    if(!snap.exists()){
      $('loading').innerHTML=`<div class="notice n-warn">Δεν υπάρχουν sessions.</div>`;
      return;
    }
    const all = snap.val();
    editState = {}; sessionLlmCache = {};

    const matched = Object.entries(all)
      .filter(([, s]) => (s.personaTitle||'').trim() === personaTitle.trim())
      .sort(([,a],[,b]) => (a.query||'').localeCompare(b.query||'', 'el'));

    $('hdr-sub').textContent = `${matched.length} session${matched.length!==1?'s':''}`;

    if(matched.length === 0){
      $('loading').innerHTML=`<div class="notice n-warn">Δεν βρέθηκαν sessions για αυτή την Persona.</div>`;
      return;
    }

    const html = matched.map(([code, s], idx) => {
      const llms = normalizeLlms(s);
      sessionLlmCache[code] = llms;

      const allEvals = s.evaluations ? Object.entries(s.evaluations) : [];
      // Group this session's evaluation records by evaluator (uid/email).
      const byEvaluator = {};
      allEvals.forEach(([key, ev])=>{
        const uid = ev.evaluatorUid || ev.evaluatorEmail || ev.evaluator || 'anon';
        if(!byEvaluator[uid]) byEvaluator[uid] = { uid, records: [] };
        byEvaluator[uid].records.push([key, ev]);
      });
      const evaluatorGroups = Object.values(byEvaluator);
      const evalRows = evaluatorGroups.map(g => buildEvaluatorGroup(code, g, llms)).join('');
      const evalsSection = evaluatorGroups.length > 0
        ? `<div class="evals-bar">Αξιολογήσεις (${evaluatorGroups.length} αξιολογητ${evaluatorGroups.length!==1?'ές':'ής'})</div>${evalRows}`
        : `<div class="evals-bar">Καμία αξιολόγηση ακόμη</div>`;

      // Per-LLM evaluation stats: count of evaluations that rated each LLM + evaluator names
      const llmStats = llms.map(()=>({count:0, evaluators:[]}));
      const seenPerLlm = llms.map(()=>new Set());
      allEvals.forEach(([key, ev])=>{
        const perLlm = evalLlmData(ev, llms);
        const who = ev.evaluator || ev.evaluatorEmail || '—';
        const whoId = ev.evaluatorUid || ev.evaluatorEmail || who;
        perLlm.forEach((d, li)=>{
          const hasRating = d.ratings && Object.values(d.ratings).some(v=>v && v!=='' );
          if(hasRating){
            llmStats[li].count++;
            if(!seenPerLlm[li].has(whoId)){
              seenPerLlm[li].add(whoId);
              llmStats[li].evaluators.push(who);
            }
          }
        });
      });

      // LLM columns table: row1 = Title, row2 = Description (+more), row3 = eval count, row4 = evaluators
      const colWidth = `${(100/Math.max(llms.length,1)).toFixed(4)}%`;
      const titleCells = llms.map((l, li)=>`
        <th class="llm-th" style="width:${colWidth}">
          <div class="llm-th-num">${li+1}</div>
          <div class="llm-th-title">${esc(l.title||'—')}</div>
        </th>`).join('');

      const descCells = llms.map((l, li)=>{
        const desc = l.description || '';
        const full = esc(desc) || '—';
        const isLong = desc.length > 120;
        const short = isLong ? esc(desc.slice(0,120))+'…' : full;
        const cid = `desc-${code}-${li}`;
        const moreBtn = isLong
          ? `<button type="button" class="desc-more" onclick="toggleDesc('${cid}')" id="${cid}-btn">more ▾</button>`
          : '';
        return `
        <td class="llm-td llm-td-desc">
          <div class="llm-desc-short" id="${cid}-short">${short} ${moreBtn}</div>
          <div class="llm-desc-full" id="${cid}-full" style="display:none;">${full} <button type="button" class="desc-more" onclick="toggleDesc('${cid}')">less ▴</button></div>
        </td>`;
      }).join('');

      const countCells = llms.map((l, li)=>`
        <td class="llm-td llm-td-count">
          <span class="llm-count-badge">${llmStats[li].count}</span>
          <span class="llm-count-lbl">αξιολογήσε${llmStats[li].count===1?'ις':'ις'}</span>
        </td>`).join('');

      const evalCells = llms.map((l, li)=>{
        const names = llmStats[li].evaluators;
        const chips = names.length
          ? names.map(n=>`<span class="llm-ev-chip">${esc(n)}</span>`).join('')
          : '<span class="llm-ev-none">—</span>';
        return `<td class="llm-td llm-td-evs"><div class="llm-ev-wrap">${chips}</div></td>`;
      }).join('');

      const llmTable = `
        <div class="llm-table-wrap">
          <table class="llm-table">
            <thead><tr>${titleCells}</tr></thead>
            <tbody>
              <tr class="llm-row-desc">${descCells}</tr>
              <tr class="llm-row-count">${countCells}</tr>
              <tr class="llm-row-evs">${evalCells}</tr>
            </tbody>
          </table>
        </div>`;

      return `
        <div class="sess-card">
          <div class="sess-card-head">
            <div style="display:flex;align-items:center;gap:8px;flex:1;min-width:0;">
              <div class="sess-num">${idx+1}</div>
              <div>
                <div style="font-size:14px;font-weight:500;">${esc(s.personaTitle||'—')}</div>
                <div class="sess-meta">
                  <span class="sess-code">${esc(code)}</span>
                  &nbsp;·&nbsp; Creator: ${esc(s.creator||'')}
                  &nbsp;·&nbsp; ${esc(s.createdAt||'')}
                  &nbsp;·&nbsp; ${llms.length} LLM${llms.length!==1?'s':''}
                </div>
              </div>
            </div>
            <a href="evaluation.html?session=${esc(code)}" class="btn sm pri" style="flex-shrink:0;">+ Νέα Αξιολόγηση</a>
          </div>

          <div class="sub-cards">
            <div class="sub-card sub-role">
              <div class="sub-label">Role of the Persona</div>
              <div class="sub-val">${esc(s.personaRole||'—')}</div>
            </div>
            ${s.guidelines ? `
            <div class="sub-card sub-guide">
              <div class="sub-label">Instructional Guidelines</div>
              <div class="sub-val">${esc(s.guidelines)}</div>
            </div>` : ''}
            <div class="sub-card sub-query">
              <div class="sub-label">Query</div>
              <div class="sub-val">${esc(s.query||'—')}</div>
            </div>
            <div class="sub-card" style="background:var(--bg);border:.5px solid var(--border);">
              <div class="sub-label" style="color:var(--muted);">Πλήθος LLMs: ${llms.length}</div>
              ${llmTable}
            </div>
          </div>

          ${evalsSection}
        </div>`;
    }).join('');

    $('content').innerHTML = html;
    $('loading').style.display  = 'none';
    $('content').style.display  = 'block';

  }catch(e){
    $('loading').innerHTML=`<div class="notice n-err">Σφάλμα φόρτωσης: ${esc(e.message)}</div>`;
  }
}

function isMine(ev){
  if(!ME) return false;
  if(ev.evaluatorUid   && ev.evaluatorUid   === ME.uid)   return true;
  if(ev.evaluatorEmail && ev.evaluatorEmail === ME.email) return true;
  return false;
}

function ratedIndices(ev, llms){
  // Which LLM indices does THIS evaluation actually contain ratings for?
  const idxs = [];
  for(let i=0;i<llms.length;i++){
    let has = false;
    if(ev.llms && ev.llms[i]){
      const r = ev.llms[i].ratings;
      if(Array.isArray(r))      has = r.some(v=>v && v!=='');
      else if(r && typeof r==='object') has = Object.values(r).some(v=>v && v!=='');
    } else if(i===0 && ev.ratings){ // legacy single-LLM
      const r = ev.ratings;
      if(Array.isArray(r))      has = r.some(v=>v && v!=='');
      else if(r && typeof r==='object') has = Object.values(r).some(v=>v && v!=='');
    }
    if(has) idxs.push(i);
  }
  return idxs;
}

function buildEvaluatorGroup(sessionCode, group, llms){
  const recs = group.records;                       // [[key, ev], ...] for one evaluator
  const ev0  = recs[0][1];
  const mine = recs.some(([,ev]) => isMine(ev));
  const stateKey = sessionCode+'___'+group.uid;

  // Merge all this evaluator's records into per-LLM ratings/comments.
  // Match each record's LLM(s) to the session llms[] by llmTitle, else by index.
  const titleToIdx = {};
  llms.forEach((l, i) => { titleToIdx[(l.title||'').trim()] = i; });

  const merged = {};               // li -> {ratings, comments, timestamp, lastEdited}
  const recordKeyForLlm = {};      // li -> original record key (for save/cleanup)
  const evaluatorName = ev0.evaluator || ev0.evaluatorEmail || '—';

  recs.forEach(([key, ev]) => {
    const perLlm = evalLlmData(ev, llms);
    const rated  = ratedIndices(ev, llms);
    // Determine which session-LLM index each rated block belongs to (prefer llmTitle).
    rated.forEach(srcIdx => {
      let li = srcIdx;
      const t = (ev.llms && ev.llms[srcIdx] && (ev.llms[srcIdx].llmTitle||'').trim()) || '';
      if(t && t in titleToIdx) li = titleToIdx[t];
      merged[li] = {
        ratings:  Object.assign({}, perLlm[srcIdx].ratings  || {}),
        comments: Object.assign({}, perLlm[srcIdx].comments || {}),
        timestamp: ev.timestamp || '',
        lastEdited: ev.lastEdited || ''
      };
      recordKeyForLlm[li] = key;
    });
  });

  const ratedIdx = Object.keys(merged).map(Number).sort((a,b)=>a-b);

  // Build edit state covering ALL session LLMs (rated -> preloaded, others -> empty)
  editState[stateKey] = { llms:{}, recordKeyForLlm, uid: group.uid };
  llms.forEach((l, li) => {
    const m = merged[li];
    editState[stateKey].llms[li] = {
      ratings:  m ? Object.assign({}, m.ratings)  : {},
      comments: m ? Object.assign({}, m.comments) : {}
    };
  });

  const mineBadge = mine ? `<span class="eval-mine">Η αξιολόγησή μου</span>` : '';

  // LLM tags next to the email: rated ones highlighted, missing ones muted
  const tags = llms.map((l, li) => {
    const t = l.title || ('LLM #'+(li+1));
    const rated = (li in merged);
    return `<span class="eval-llm-tag${rated?'':' missing'}" title="${rated?'Αξιολογήθηκε':'Δεν έχει αξιολογηθεί'}">${esc(t)}</span>`;
  }).join('');

  const detailsKey = 'evdet-'+stateKey;

  // Read-only score chips per rated LLM (with each LLM's own date)
  const chipsByLlm = ratedIdx.map(li => {
    const l = llms[li] || {};
    const m = merged[li];
    const chips = CRITERIA.map(c => {
      const val = m.ratings && m.ratings[c.id] ? m.ratings[c.id] : '—';
      return `<span class="sc${mine?' mine':''}">${c.id}. ${esc(val)}</span>`;
    }).join('');
    const dateLine = m.timestamp ? `<span class="eval-when" style="margin-left:6px;">${esc(m.timestamp)}${m.lastEdited?` · ✏ ${esc(m.lastEdited)}`:''}</span>` : '';
    return `
      <div class="llm-scores-group">
        <div class="llm-scores-label"><span class="llm-mini-num">${li+1}</span>${esc(l.title||('LLM #'+(li+1)))}${dateLine}</div>
        <div class="scores-wrap">${chips}</div>
      </div>`;
  }).join('');

  const missingIdx = llms.map((_,i)=>i).filter(i => !(i in merged));
  const missingNote = missingIdx.length
    ? `<div class="eval-missing-note">Δεν έχει αξιολογήσει: ${missingIdx.map(i=>esc(llms[i].title||('LLM #'+(i+1)))).join(', ')}</div>`
    : '';

  const summaryRow = `
    <div class="eval-row-item">
      <div class="eval-avatar">${ini(evaluatorName)}</div>
      <div style="flex:1;min-width:0;">
        <div class="eval-who">${esc(evaluatorName)} ${tags}${mineBadge}</div>
        <div class="eval-when">${ratedIdx.length}/${llms.length} LLMs αξιολογημένα</div>
      </div>
      <button type="button" class="btn sm eval-more-btn" id="${esc(detailsKey)}-btn" onclick="toggleEvalDetails('${esc(detailsKey)}')">more ▾</button>
    </div>
    <div class="eval-details" id="${esc(detailsKey)}" style="display:none;">
      ${chipsByLlm || '<div class="muted" style="font-size:12px;">—</div>'}
      ${missingNote}
      ${mine ? `<div style="margin-top:.6rem;"><a class="btn sm" href="evaluation.html?session=${encodeURIComponent(sessionCode)}">✏ Επεξεργασία / Συμπλήρωση</a></div>` : ''}
    </div>`;

  return summaryRow;
}

window.toggleEvalDetails = function(key){
  const el=$(key); if(!el) return;
  const btn=$(key+'-btn');
  const opening = el.style.display==='none';
  el.style.display = opening ? 'block' : 'none';
  if(btn) btn.textContent = opening ? 'less ▴' : 'more ▾';
};

window.toggleDesc = function(cid){
  const short=$(cid+'-short'), full=$(cid+'-full');
  if(!short||!full) return;
  const showFull = full.style.display==='none';
  full.style.display  = showFull ? 'block' : 'none';
  short.style.display = showFull ? 'none'  : 'block';
};

window.toggleEdit = function(sk){
  const el=$('ef-'+sk); if(!el) return;
  const opening = !el.classList.contains('open');
  el.classList.toggle('open');
  if(opening) el.scrollIntoView({behavior:'smooth',block:'start'});
};

window.pickOpt = function(sk, li, cid, val){
  if(!editState[sk] || !editState[sk].llms[li]) return;
  editState[sk].llms[li].ratings[cid] = val;
  const g=$('mcg-'+sk+'-'+li+'-'+cid);
  if(g) g.querySelectorAll('.emco').forEach(b=>{
    b.classList.toggle('sel', b.textContent.trim()===val);
    b.classList.remove('er');
  });
  const e=$('merr-'+sk+'-'+li+'-'+cid); if(e) e.style.display='none';
};

window.pickCmt = function(sk, li, cid, val){
  if(!editState[sk] || !editState[sk].llms[li]) return;
  editState[sk].llms[li].comments[cid] = val;
};

window.saveEvaluatorEdit = async function(sessionCode, sk){
  const state = editState[sk]; if(!state) return;
  const llms = sessionLlmCache[sessionCode] || [];
  let valid=true, firstBad=null;

  // Require all criteria for ALL LLMs (so missing ones get completed too)
  llms.forEach((l, li) => {
    CRITERIA.forEach(c=>{
      if(!state.llms[li] || !state.llms[li].ratings[c.id]){
        const e=$('merr-'+sk+'-'+li+'-'+c.id); if(e) e.style.display='block';
        const g=$('mcg-'+sk+'-'+li+'-'+c.id); if(g) g.querySelectorAll('.emco').forEach(b=>b.classList.add('er'));
        valid=false; if(!firstBad) firstBad=$('merr-'+sk+'-'+li+'-'+c.id);
      }
    });
  });
  if(!valid){
    const m=$('ef-msg-'+sk); if(m) m.innerHTML=`<div class="notice n-err" style="margin:.5rem 0;">Συμπλήρωσε όλα τα κριτήρια για όλα τα LLMs.</div>`;
    if(firstBad) firstBad.scrollIntoView({behavior:'smooth',block:'center'});
    return;
  }

  const ld=$('ef-load-'+sk); if(ld) ld.style.display='';
  try{
    // Build a single consolidated record holding all LLMs for this evaluator.
    const llmsPayload={};
    llms.forEach((l, li) => {
      const ratings={}, comments={};
      CRITERIA.forEach(c=>{
        ratings[c.id]  = state.llms[li].ratings[c.id]  || '';
        comments[c.id] = state.llms[li].comments[c.id] || '';
      });
      llmsPayload[li] = { llmTitle:l.title||'', ratings, comments };
    });

    // Earliest original timestamp (if any) is preserved; else now().
    const recordKeyForLlm = state.recordKeyForLlm || {};
    const oldKeys = [...new Set(Object.values(recordKeyForLlm))];
    let baseTs = now();
    if(oldKeys.length){
      try{
        const snaps = await Promise.all(oldKeys.map(k =>
          db.ref('sessions/'+sessionCode+'/evaluations/'+k+'/timestamp').get()));
        const tss = snaps.filter(s=>s.exists()).map(s=>s.val());
        if(tss.length) baseTs = tss[0];
      }catch(e){}
    }

    const consolidated = {
      evaluator:      ME.displayName||ME.email,
      evaluatorEmail: ME.email,
      evaluatorUid:   ME.uid,
      timestamp:      baseTs,
      lastEdited:     now(),
      llms:           llmsPayload
    };

    // Reuse the first old key if present; otherwise push a new key.
    let targetKey = oldKeys.length ? oldKeys[0] : null;
    if(targetKey){
      await db.ref('sessions/'+sessionCode+'/evaluations/'+targetKey).set(consolidated);
    } else {
      const ref = db.ref('sessions/'+sessionCode+'/evaluations').push();
      targetKey = ref.key;
      await ref.set(consolidated);
    }

    // Remove the evaluator's other (now-merged) records to avoid duplicates.
    const removals = oldKeys.filter(k => k && k !== targetKey)
      .map(k => db.ref('sessions/'+sessionCode+'/evaluations/'+k).remove());
    if(removals.length) await Promise.all(removals);

    if(ld) ld.style.display='none';
    load();
  }catch(e){
    if(ld) ld.style.display='none';
    const m=$('ef-msg-'+sk); if(m) m.innerHTML=`<div class="notice n-err" style="margin:.5rem 0;">Σφάλμα: ${esc(e.message)}</div>`;
  }
};
</script>
