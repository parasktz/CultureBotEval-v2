name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Το config.js είναι ήδη committed στο repo με τα σωστά κλειδιά,
      # οπότε ΔΕΝ το ξαναγράφουμε. (Τα Firebase web keys είναι δημόσια by design,
      # προστατεύονται από τα Database Rules + Authorized domains.)

      - name: Verify config.js exists
        run: |
          echo "=== config.js (key hidden) ==="
          grep "apiKey" config.js | sed 's/"AIza[^"]*"/"AIza***"/g'
          grep "projectId" config.js

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
