<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>CultureBotEval-v2 — Statistics</title>
<script src="config.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{
  --bg:#f4f3ee;--card:#fff;--border:rgba(0,0,0,.09);
  --text:#18180f;--muted:#68685f;--mono:ui-monospace,SFMono-Regular,Menlo,monospace;
  --blue:#2b7fd4;--blue-bg:#e8f2fc;--blue-t:#0a3d6e;
  --green:#1f9d57;--green-bg:#e6f6ed;
  --amber:#b9770e;--amber-bg:#fdf3e0;
  --purple:#7a4fd0;--purple-bg:#efe9fb;
  --r:10px;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
     background:var(--bg);color:var(--text);min-height:100vh;}

.topbar{background:var(--card);border-bottom:.5px solid var(--border);
        padding:.8rem 2rem;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:20;}
.topbar-logo{font-size:11px;letter-spacing:.12em;color:var(--muted);text-transform:uppercase;}
.topbar-logo a{color:inherit;text-decoration:none;}
.topbar-sep{color:var(--border);}
.topbar-title{font-size:15px;font-weight:500;color:var(--blue-t);}
.topbar-spacer{flex:1;}
.topbar-user{font-size:12px;color:var(--muted);}
.btn{background:var(--blue);color:#fff;border:none;border-radius:6px;
     padding:.45rem 1rem;font-size:12px;font-weight:500;cursor:pointer;}
.btn.ghost{background:transparent;color:var(--blue);border:1px solid var(--blue);}
.btn:hover{opacity:.9;}

.screen{min-height:70vh;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:1rem;padding:2rem;}
.login-box{background:var(--card);border:.5px solid var(--border);border-radius:var(--r);
           padding:2rem;max-width:340px;width:100%;display:flex;flex-direction:column;gap:.75rem;}
.login-box h2{font-size:18px;font-weight:500;color:var(--blue-t);}
.login-box input{padding:.6rem .7rem;border:1px solid var(--border);border-radius:6px;font-size:13px;}
.err{color:#c0392b;font-size:12px;min-height:1em;}
.muted{color:var(--muted);font-size:13px;}

.wrap{max-width:1080px;margin:0 auto;padding:1.5rem 2rem 4rem;width:100%;}
.tabs{display:flex;gap:.4rem;border-bottom:1px solid var(--border);margin-bottom:1.5rem;}
.tab{padding:.7rem 1.1rem;font-size:13px;font-weight:500;color:var(--muted);
     background:none;border:none;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;}
.tab.active{color:var(--blue-t);border-bottom-color:var(--blue);}
.tab-panel{display:none;}
.tab-panel.active{display:block;}

.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:1rem;margin-bottom:1.75rem;}
.card{background:var(--card);border:.5px solid var(--border);border-radius:var(--r);padding:1rem 1.25rem;}
.card-lbl{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);}
.card-val{font-size:26px;font-weight:600;color:var(--blue-t);margin-top:.25rem;}

.role-block{background:var(--card);border:.5px solid var(--border);border-radius:var(--r);
            margin-bottom:1.25rem;overflow:hidden;}
.role-head{padding:1rem 1.25rem;display:flex;align-items:center;justify-content:space-between;
           gap:1rem;flex-wrap:wrap;border-bottom:.5px solid var(--border);background:#fafaf7;}
.role-text{font-size:15px;font-weight:600;color:var(--text);}
.badges{display:flex;gap:.4rem;flex-wrap:wrap;}
.badge{font-size:11px;padding:3px 9px;border-radius:20px;font-weight:500;white-space:nowrap;}
.b-blue{background:var(--blue-bg);color:var(--blue-t);}
.b-green{background:var(--green-bg);color:var(--green);}
.b-amber{background:var(--amber-bg);color:var(--amber);}
.b-purple{background:var(--purple-bg);color:var(--purple);}
.q-list{padding:.5rem 1.25rem 1rem;}
.q-row{display:flex;gap:.8rem;padding:.7rem 0;border-bottom:.5px solid var(--border);}
.q-row:last-child{border-bottom:none;}
.q-idx{flex:none;width:26px;height:26px;border-radius:50%;background:var(--blue-bg);
       color:var(--blue-t);font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:center;}
.q-body{flex:1;min-width:0;}
.q-text{font-size:13px;line-height:1.5;margin-bottom:.45rem;}
.q-metrics{display:flex;gap:.4rem;flex-wrap:wrap;}
.metric{font-size:11px;padding:2px 8px;border-radius:6px;background:var(--bg);color:var(--muted);font-family:var(--mono);}
.metric strong{color:var(--text);}

.qsel{margin-bottom:1.25rem;}
.qsel label{font-size:12px;color:var(--muted);display:block;margin-bottom:.35rem;}
.qsel select{width:100%;padding:.6rem .7rem;border:1px solid var(--border);border-radius:6px;font-size:13px;background:var(--card);}
.crit-block{background:var(--card);border:.5px solid var(--border);border-radius:var(--r);
            padding:1.1rem 1.25rem;margin-bottom:1.1rem;}
.crit-head{font-size:13px;font-weight:600;color:var(--blue-t);margin-bottom:.15rem;}
.crit-sub{font-size:11px;color:var(--muted);margin-bottom:.75rem;}
.chart-holder{position:relative;height:230px;}
.empty{padding:3rem 1rem;text-align:center;color:var(--muted);font-size:14px;}
.legend-note{font-size:11px;color:var(--muted);margin:.5rem 0 1.25rem;}
.persona-tag{display:inline-block;font-size:11px;color:var(--muted);margin-bottom:1rem;}
</style>
</head>
<body>

<div class="topbar">
  <span class="topbar-logo"><a href='https://parasktz.github.io/CultureBotEval-v2'>CultureBotEval-v2</a></span>
  <span class="topbar-sep">|</span>
  <span class="topbar-title">Statistics</span>
  <span class="topbar-spacer"></span>
  <span class="topbar-user" id="user-email"></span>
  <button class="btn ghost" id="logout-btn" style="display:none" onclick="doLogout()">Sign out</button>
</div>

<div class="screen" id="screen-loading"><div class="muted">Loading…</div></div>

<div class="screen" id="screen-login" style="display:none">
  <div class="login-box">
    <h2>Sign in</h2>
    <p class="muted">Access restricted to verified users.</p>
    <input id="email" type="email" placeholder="Email" autocomplete="username"/>
    <input id="pass"  type="password" placeholder="Password" autocomplete="current-password"/>
    <div class="err" id="login-err"></div>
    <button class="btn" onclick="doLogin()">Sign in</button>
  </div>
</div>

<div class="screen" id="screen-denied" style="display:none">
  <div class="muted">Access denied — your account is not a verified user.</div>
  <button class="btn ghost" onclick="doLogout()">Sign out</button>
</div>

<div class="wrap" id="screen-app" style="display:none">
  <div class="tabs">
    <button class="tab active" data-tab="t1" onclick="switchTab('t1')">By Persona / Query</button>
    <button class="tab" data-tab="t2" onclick="switchTab('t2')">By Query — LLM Ratings</button>
  </div>

  <div class="tab-panel active" id="t1">
    <div class="cards" id="t1-cards"></div>
    <div id="t1-body"></div>
  </div>

  <div class="tab-panel" id="t2">
    <div class="qsel">
      <label for="q-select">Select a query</label>
      <select id="q-select" onchange="renderCriteria()"></select>
    </div>
    <div class="legend-note">Each chart shows how evaluators rated every LLM on a criterion. Bars = number of evaluations choosing each option.</div>
    <div id="t2-body"></div>
  </div>
</div>

<script>
const CRITERIA = [
  {id:1,  name:'Hallucination Flag',                      opts:['No Hallucination','Minor Hallucination','Major Hallucination','Cannot Determine']},
  {id:2,  name:'Query Relevance',                         opts:['Fully Relevant','Mostly Relevant','Partially Relevant','Not Relevant']},
  {id:3,  name:'Justification Quality',                   opts:['Excellent','Good','Fair','Poor']},
  {id:4,  name:'Evidence Grounding',                      opts:['Well Grounded','Mostly Grounded','Partially Grounded','Ungrounded']},
  {id:5,  name:'Clarity',                                 opts:['Very Clear','Clear','Somewhat Clear','Unclear']},
  {id:6,  name:'Result Usefulness',                       opts:['Very Useful','Useful','Somewhat Useful','Not Useful']},
  {id:7,  name:'Bias',                                    opts:['No Bias','Slight Bias','Moderate Bias','Significant Bias']},
  {id:8,  name:'Diversity',                               opts:['High','Moderate','Low','None']},
  {id:9,  name:'Completeness / Variety / Representative', opts:['Excellent','Good','Fair','Poor']},
  {id:10, name:'Needed Logical Steps',                    opts:['All Present','Mostly Present','Partially Present','Missing']}
];

const LLM_COLORS = ['#2b7fd4','#1f9d57','#b9770e','#7a4fd0','#d0457a','#0fa6a6','#888'];

function esc(s){const d=document.createElement('div');d.textContent=(s==null?'':String(s));return d.innerHTML;}

function normIndexed(x){
  const out = new Array(11).fill(null);
  if(Array.isArray(x)){
    for(let i=1;i<=10 && i<x.length;i++) out[i] = (x[i]===''?null:(x[i] ?? null));
  } else if(x && typeof x === 'object'){
    Object.entries(x).forEach(([k,v])=>{
      const i = parseInt(k,10);
      if(i>=1 && i<=10) out[i] = (v===''?null:v);
    });
  }
  return out;
}

function llmHasRatings(llmBlock){
  if(!llmBlock || typeof llmBlock !== 'object') return false;
  const r = normIndexed(llmBlock.ratings);
  for(let i=1;i<=10;i++){ if(r[i]) return true; }
  return false;
}

function validLlmBlocks(rec){
  if(!rec || typeof rec.llms !== 'object' || rec.llms===null) return [];
  return Object.values(rec.llms)
    .filter(l => llmHasRatings(l))
    .map(l => ({ title: (l.llmTitle || 'Untitled LLM').toString().trim() || 'Untitled LLM',
                 ratings: normIndexed(l.ratings) }));
}

function forEachEvaluation(sessions, cb){
  Object.entries(sessions).forEach(([code,s])=>{
    if(!s || typeof s !== 'object') return;
    const ev = s.evaluations;
    if(!ev || typeof ev !== 'object') return;
    Object.entries(ev).forEach(([key,rec])=>{
      if(!rec || typeof rec !== 'object') return;
      if(key==='timestamp' || key==='metadata') return;
      cb(s, rec, key, code);
    });
  });
}

let SESSIONS = {};

firebase.initializeApp(FIREBASE_CONFIG);
const auth = firebase.auth();
const db   = firebase.database();

auth.onAuthStateChanged(async user => {
  if(!user){ show('screen-login'); return; }

  let allowed = false;
  try { const snap = await db.ref('verified_creators/' + user.uid).once('value'); if(snap.exists()) allowed = true; } catch(e){}
  if(!allowed){
    try {
      const snap = await db.ref('verified_creators').once('value');
      const vc = snap.val() || {};
      Object.values(vc).forEach(v => {
        if(v === true) return;
        if(v && (v.email === user.email || v.uid === user.uid)) allowed = true;
      });
    } catch(e){}
  }
  if(!allowed){ try { const snap = await db.ref('admins/' + user.uid).once('value'); if(snap.exists()) allowed = true; } catch(e){} }

  document.getElementById('user-email').textContent = user.email;
  document.getElementById('logout-btn').style.display = 'inline-block';

  if(!allowed){ show('screen-denied'); return; }
  await loadData();
});

async function loadData(){
  show('screen-loading');
  try{
    const snap = await db.ref('sessions').once('value');
    SESSIONS = snap.val() || {};
    buildTab1();
    buildTab2Selector();
    show('screen-app');
  }catch(e){
    console.error('[statistics] load failed', e);
    document.getElementById('screen-loading').innerHTML =
      '<div class="muted">Failed to load data: '+esc(e.message)+'</div>';
  }
}

async function doLogin(){
  document.getElementById('login-err').textContent = '';
  try{
    await auth.signInWithEmailAndPassword(
      document.getElementById('email').value,
      document.getElementById('pass').value
    );
  }catch(e){ document.getElementById('login-err').textContent = e.message; }
}
async function doLogout(){ await auth.signOut(); location.reload(); }

function show(id){
  ['screen-loading','screen-login','screen-denied','screen-app'].forEach(s=>{
    document.getElementById(s).style.display = (s===id) ? (s==='screen-app'?'block':'flex') : 'none';
  });
}
function switchTab(t){
  document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active', b.dataset.tab===t));
  document.querySelectorAll('.tab-panel').forEach(p=>p.classList.toggle('active', p.id===t));
}

/* ── TAB 1 — By Persona / Query ── */
function buildTab1(){
  const byPersona = {};
  const allEvaluators = new Set();
  let totalResponses = 0, totalRecords = 0;

  forEachEvaluation(SESSIONS, (s, rec)=>{
    const blocks = validLlmBlocks(rec);
    if(!blocks.length) return;
    const persona = s.personaTitle || 'Unknown persona';
    const query   = s.query || '(no query)';
    const evId    = rec.evaluatorUid || rec.evaluatorEmail || rec.evaluator || 'anon';

    if(!byPersona[persona]) byPersona[persona] = {queries:{}, evaluators:new Set()};
    if(!byPersona[persona].queries[query]) byPersona[persona].queries[query] = {responses:0, evaluators:new Set(), records:0};

    byPersona[persona].queries[query].responses += blocks.length;
    byPersona[persona].queries[query].records   += 1;
    byPersona[persona].queries[query].evaluators.add(evId);
    byPersona[persona].evaluators.add(evId);
    allEvaluators.add(evId);
    totalResponses += blocks.length;
    totalRecords   += 1;
  });

  const personaNames = Object.keys(byPersona).sort();
  const totalQueries = personaNames.reduce((a,p)=>a+Object.keys(byPersona[p].queries).length,0);

  document.getElementById('t1-cards').innerHTML = `
    <div class="card"><div class="card-lbl">Personas</div><div class="card-val">${personaNames.length}</div></div>
    <div class="card"><div class="card-lbl">Queries evaluated</div><div class="card-val">${totalQueries}</div></div>
    <div class="card"><div class="card-lbl">LLM responses</div><div class="card-val">${totalResponses}</div></div>
    <div class="card"><div class="card-lbl">Evaluation records</div><div class="card-val">${totalRecords}</div></div>
    <div class="card"><div class="card-lbl">Unique evaluators</div><div class="card-val">${allEvaluators.size}</div></div>`;

  if(!personaNames.length){
    document.getElementById('t1-body').innerHTML = '<div class="empty">📭 No completed evaluations yet.</div>';
    return;
  }

  document.getElementById('t1-body').innerHTML = personaNames.map(p=>{
    const data   = byPersona[p];
    const qNames = Object.keys(data.queries).sort();
    const pResp  = qNames.reduce((a,q)=>a+data.queries[q].responses,0);
    const rows = qNames.map((q,i)=>{
      const qd = data.queries[q];
      return `
      <div class="q-row">
        <div class="q-idx">${i+1}</div>
        <div class="q-body">
          <div class="q-text">${esc(q)}</div>
          <div class="q-metrics">
            <span class="metric"><strong>${qd.responses}</strong> response${qd.responses!==1?'s':''}</span>
            <span class="metric"><strong>${qd.evaluators.size}</strong> evaluator${qd.evaluators.size!==1?'s':''}</span>
            <span class="metric"><strong>${qd.records}</strong> record${qd.records!==1?'s':''}</span>
          </div>
        </div>
      </div>`;
    }).join('');
    return `
    <div class="role-block">
      <div class="role-head">
        <div class="role-text">${esc(p)}</div>
        <div class="badges">
          <span class="badge b-blue">${qNames.length} quer${qNames.length!==1?'ies':'y'}</span>
          <span class="badge b-amber">${pResp} response${pResp!==1?'s':''}</span>
          <span class="badge b-purple">${data.evaluators.size} unique evaluator${data.evaluators.size!==1?'s':''}</span>
        </div>
      </div>
      <div class="q-list">${rows}</div>
    </div>`;
  }).join('');
}

/* ── TAB 2 — By Query: LLM rating distributions ── */
let charts = [];

function buildTab2Selector(){
  const queries = {};
  forEachEvaluation(SESSIONS, (s, rec)=>{
    if(!validLlmBlocks(rec).length) return;
    const q = s.query || '(no query)';
    if(!(q in queries)) queries[q] = s.personaTitle || 'Unknown persona';
  });
  const qNames = Object.keys(queries).sort();
  const sel = document.getElementById('q-select');
  if(!qNames.length){
    sel.innerHTML = '<option>No evaluated queries yet</option>';
    document.getElementById('t2-body').innerHTML = '<div class="empty">📭 No completed evaluations yet.</div>';
    return;
  }
  sel.innerHTML = qNames.map(q=>`<option value="${esc(q)}" data-persona="${esc(queries[q])}">${esc(q.length>90?q.slice(0,90)+'…':q)}</option>`).join('');
  renderCriteria();
}

function renderCriteria(){
  charts.forEach(c=>{ try{c.destroy();}catch(e){} });
  charts = [];

  const sel = document.getElementById('q-select');
  const query = sel.value;
  const persona = sel.options[sel.selectedIndex] ? sel.options[sel.selectedIndex].dataset.persona : '';

  const llmSet = new Set();
  const dist = {};
  CRITERIA.forEach(c=>dist[c.id]={});

  forEachEvaluation(SESSIONS, (s, rec)=>{
    if((s.query || '(no query)') !== query) return;
    validLlmBlocks(rec).forEach(block=>{
      llmSet.add(block.title);
      CRITERIA.forEach(c=>{
        const val = block.ratings[c.id];
        if(!val) return;
        if(!dist[c.id][block.title]) dist[c.id][block.title] = {};
        dist[c.id][block.title][val] = (dist[c.id][block.title][val]||0) + 1;
      });
    });
  });

  const llms = [...llmSet].sort();
  const body = document.getElementById('t2-body');

  if(!llms.length){
    body.innerHTML = '<div class="empty">No ratings found for this query.</div>';
    return;
  }

  body.innerHTML =
    `<div class="persona-tag">Persona: <strong>${esc(persona)}</strong> · LLMs: ${llms.map(esc).join(', ')}</div>` +
    CRITERIA.map(c=>`
      <div class="crit-block">
        <div class="crit-head">${c.id}. ${esc(c.name)}</div>
        <div class="crit-sub">Distribution of evaluator choices per LLM</div>
        <div class="chart-holder"><canvas id="chart-${c.id}"></canvas></div>
      </div>`).join('');

  CRITERIA.forEach(c=>{
    const labels = c.opts;
    const datasets = llms.map((llm,idx)=>({
      label: llm,
      data: labels.map(opt => (dist[c.id][llm] && dist[c.id][llm][opt]) || 0),
      backgroundColor: LLM_COLORS[idx % LLM_COLORS.length],
      borderRadius: 3,
      maxBarThickness: 38
    }));
    const ctx = document.getElementById('chart-'+c.id);
    const chart = new Chart(ctx, {
      type:'bar',
      data:{ labels, datasets },
      options:{
        responsive:true, maintainAspectRatio:false,
        plugins:{
          legend:{ position:'bottom', labels:{ boxWidth:12, font:{size:11} } },
          tooltip:{ callbacks:{ label: ctx => ` ${ctx.dataset.label}: ${ctx.raw} eval${ctx.raw===1?'':'s'}` } }
        },
        scales:{
          y:{ beginAtZero:true, ticks:{ precision:0, font:{size:10} }, title:{display:true,text:'# evaluations',font:{size:10}} },
          x:{ ticks:{ font:{size:10} } }
        }
      }
    });
    charts.push(chart);
  });
}
</script>

</body>
</html>
